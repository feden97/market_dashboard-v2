<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Dashboard Financiero Argentina</title>

  <!-- PWA & SEO Meta Tags -->
  <meta name="description" content="Dashboard financiero en tiempo real: Dólares, Inflación, Tasas y Plazos Fijos en Argentina." />
  <meta name="theme-color" content="#0A0F1C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dashboard AR" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    // Apply theme before first paint to avoid flash
    (function () {
      let saved;
      try { saved = localStorage.getItem('theme-preference'); } catch (_) {}
      const system = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved === 'dark' || saved === 'light' ? saved : (system ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <script>
    // Run before the module graph: an old worker can otherwise prevent the
    // development entry point (and its worker cleanup) from loading at all.
    if ('%DEV%' === 'true' && 'serviceWorker' in navigator) {
      const appScope = new URL('./', window.location.href).href;
      navigator.serviceWorker.getRegistrations().then(async (registrations) => {
        const ownWorkers = registrations.filter((registration) => registration.scope === appScope);
        const wasControlled = Boolean(navigator.serviceWorker.controller);
        await Promise.all(ownWorkers.map((registration) => registration.unregister()));
        if (ownWorkers.length && wasControlled) window.location.reload();
      }).catch((error) => console.warn('Could not remove development service worker:', error));
    }
  </script>
</head>
<body>
  <noscript>Activá JavaScript en tu navegador para ver el dashboard financiero.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
