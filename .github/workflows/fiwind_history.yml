name: Collect Fiwind USDT USD history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fiwind_history.yml'
      - 'scripts/collect_fiwind.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiwind-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Open the persistent data branch
        shell: bash
        run: |
          set -euo pipefail
          ref="$(git ls-remote --heads origin refs/heads/fiwind-history)"
          if [[ -n "$ref" ]]; then
            git fetch --depth=1 origin fiwind-history
            git worktree add --detach history FETCH_HEAD
          else
            git worktree add --orphan -b fiwind-history history
          fi
      - name: Record a fresh observation
        run: python scripts/collect_fiwind.py --output history/fiwind.json
      - name: Persist history without rebuilding the dashboard
        shell: bash
        run: |
          set -euo pipefail
          git -C history config user.name 'github-actions[bot]'
          git -C history config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C history add fiwind.json
          if ! git -C history diff --cached --quiet; then
            git -C history commit -m 'data: record Fiwind USDT/USD'
            git -C history push origin HEAD:refs/heads/fiwind-history
          fi
